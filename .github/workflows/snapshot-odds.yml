# Daily odds snapshot — the data capture. Pulls the F1 Drivers' Champion
# market from Polymarket's free, keyless public API, appends to /data/odds/
# and commits. Runs all season; can be run by hand from the Actions tab.
name: Snapshot odds

on:
  schedule:
    - cron: '0 12 * * *' # 12:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # No API key needed — Polymarket's public API is keyless.
      - name: Take odds snapshot
        run: npm run snapshot:odds

      - name: Rebuild derived data
        if: always() # even a failed quota guard has saved a snapshot worth publishing
        run: npm run build:derived

      - name: Commit snapshot
        if: always()
        run: |
          git config user.name "odds-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "odds snapshot $(date -u +%F)"
          # data/derived/* is regenerated by every job, so concurrent commits can
          # conflict there; -X theirs keeps our regenerated copy and a short retry
          # loop absorbs a push race with the other data job.
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin ${GITHUB_REF_NAME} && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "Could not push after 3 attempts" >&2
          exit 1
