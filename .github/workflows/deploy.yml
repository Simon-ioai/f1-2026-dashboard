# Build the site and publish to GitHub Pages on every push to main —
# including the automated data commits from the two cron jobs, so the
# dashboard redeploys itself whenever new data lands.
name: Deploy to GitHub Pages

# NOTE: pushes made by the data jobs use the workflow GITHUB_TOKEN, and
# GitHub deliberately does not let those trigger on:push workflows. The
# workflow_run trigger below is what redeploys the site after every data
# commit; on:push covers pushes from a human.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Snapshot odds", "Rebuild dashboard"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
